name: Generate EVA M5 Micro-Voxel Asset

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-eva-microvoxel.py"
      - ".github/workflows/generate-eva-microvoxel.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install voxel build dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Generate M5 micro-voxel EVA
        run: python scripts/generate-eva-microvoxel.py
      - name: Check runtime JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/cage/loadEvaMicroVoxel.js
      - name: Validate runtime and M5 asset contract
        run: npm test
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/eva-microvoxel-m5.bin assets/models/eva-microvoxel-m5.json
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "build: generate M5 micro-voxel EVA assets [skip ci]"
          git push origin HEAD:main
