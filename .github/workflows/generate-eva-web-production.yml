name: Generate EVA Web Production Asset

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-eva-web-production.py"
      - "scripts/validate.mjs"
      - "src/config.js"
      - "src/cage/loadEvaGlb.js"
      - ".github/workflows/generate-eva-web-production.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mesh dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-image trimesh
      - name: Generate continuous production EVA
        run: python scripts/generate-eva-web-production.py
      - name: Validate Web runtime and generated GLB
        run: npm test
      - name: Commit generated GLB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/eva-unit-continuous-prod.glb
          if git diff --cached --quiet; then
            echo "No generated asset changes."
            exit 0
          fi
          git commit -m "build: generate continuous production EVA GLB [skip ci]"
          git push origin HEAD:main
