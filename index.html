<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b0d" />
    <title>EVA Cage — Continuous M4</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="hud-title">EVA CAGE — CONTINUOUS M4 PRODUCTION</div>
      <div>WASD: move / Mouse: look / Shift: fast</div>
      <div>Fly: G toggle / Space or E: up / Ctrl or Q: down</div>
      <div>B: debug brightness / K: Entry Plug keep-out / H: human ref / F: fluid</div>
      <div id="status">Click to enter</div>
    </div>
    <div id="crosshair" aria-hidden="true"></div>
    <button id="start" type="button">
      <strong>ENTER CAGE</strong>
      <span>クリックして一人称視点を開始</span>
    </button>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
